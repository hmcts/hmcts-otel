[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hmcts-otel"
version = "0.1.0"
description = "Privacy-safe OpenTelemetry setup for HMCTS Python services on Azure"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "HMCTS" }]
maintainers = [{ name = "HMCTS" }]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Topic :: System :: Monitoring",
]
# Ranges, not pins: the Azure Monitor distro pins the OpenTelemetry packages it
# needs, and consuming apps resolve the rest. Pinning here would fight the apps.
dependencies = [
    "azure-monitor-opentelemetry>=1.8.7,<2",
    "opentelemetry-api>=1.40,<2",
    "opentelemetry-sdk>=1.40,<2",
    "pydantic-settings>=2.0.0",
]

[project.urls]
Homepage = "https://github.com/hmcts/hmcts-otel"
Repository = "https://github.com/hmcts/hmcts-otel"

[project.optional-dependencies]
# FastAPI request instrumentation, request-ID middleware and the browser relay.
# opentelemetry-instrumentation-fastapi is already a dependency of the distro.
fastapi = ["fastapi>=0.115.0"]
sqlalchemy = ["opentelemetry-instrumentation-sqlalchemy>=0.61b0"]
sentry = ["sentry-sdk>=2.40.0"]
# Entra (managed identity) authenticated ingestion.
entra = ["azure-identity>=1.19.0"]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "fastapi>=0.115.0",
    "sentry-sdk>=2.40.0",
    "uvicorn>=0.30.0",
    "hatch>=1.14.0",
    "ruff>=0.8.0",
    "pyright>=1.1.380",
]

[tool.hatch.build.targets.wheel]
packages = ["hmcts_otel"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyright]
include = ["hmcts_otel"]
pythonVersion = "3.11"
