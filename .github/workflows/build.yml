name: Build

# Validates the package builds on every PR, and publishes the wheel/sdist to the
# shared HMCTS Azure DevOps Artifacts feed (hmcts-lib) — the same feed the Java
# libraries publish to (mirrors api-cp-caseadmin-case-urn-mapper's ci-draft /
# ci-released Gradle publish, but for a Python artefact via twine).
#
#   push to main        -> <pyproject version>.dev<run>+<sha>   (draft)
#   published release   -> <pyproject version>, = the tag        (release)
#
# Auth is basic auth to Azure Artifacts using the org secrets
# AZURE_DEVOPS_ARTIFACT_USERNAME / AZURE_DEVOPS_ARTIFACT_TOKEN (same as Gradle).

on:
  pull_request:
    branches: [main]
    # Skip docs/config-only changes — packaging is unaffected.
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
      - '.claude/**'
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build sdist + wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true

      - name: Build package
        run: uv build

      - name: Check package metadata (twine)
        run: uvx twine check dist/*

      - name: Upload build artefacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  # Compute the artefact version. The base is always the version in pyproject.toml;
  # hmcts/artefact-version-action (the action the Java libraries use) supplies only
  # the commit SHA for drafts and the tag for releases. Its draft base comes from the
  # latest v* tag (0.0.0 without one), so it is not used. See docs/releasing.md.
  artefact-version:
    name: Artefact Version
    if: github.event_name == 'push' || github.event_name == 'release'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.pick.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the action runs git describe

      - name: Generate artefact version
        id: artefact
        uses: hmcts/artefact-version-action@v1
        with:
          release: ${{ github.event_name == 'release' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Select draft/release version
        id: pick
        env:
          EVENT: ${{ github.event_name }}
          RUN_NUMBER: ${{ github.run_number }}
          DRAFT_VERSION: ${{ steps.artefact.outputs.draft_version }}
          RELEASE_VERSION: ${{ steps.artefact.outputs.release_version }}
        run: |
          # Drafts: "<pyproject version>.dev<run_number>+<sha>" (e.g. 0.2.1.dev47+46dfd2f).
          # Releases: the pyproject version, which must match the release tag.
          VERSION="$(scripts/artefact_version.sh)"
          echo "Artefact version: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  publish:
    name: Publish to Azure Artifacts (hmcts-lib)
    needs: [build, artefact-version]
    if: github.event_name == 'push' || github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true

      - name: Set the artefact version and build
        env:
          VERSION: ${{ needs.artefact-version.outputs.version }}
        run: |
          # VERSION is PEP 440: "<base>.dev<n>+<sha>" for a draft, "<base>" for a
          # release (see scripts/artefact_version.sh). The .dev<n> orders drafts;
          # a hex SHA is only legal in the "+" local segment.
          test -n "$VERSION"
          echo "Publishing hmcts-otel version: $VERSION"
          sed -i.bak -E "s/^version = \".*\"/version = \"$VERSION\"/" pyproject.toml
          rm -f pyproject.toml.bak
          grep -qxF "version = \"$VERSION\"" pyproject.toml
          uv build
          # Fail if the built wheel does not carry the computed version.
          test -f "dist/hmcts_otel-${VERSION}-py3-none-any.whl"

      - name: Publish to the hmcts-lib PyPI feed
        env:
          # Same Azure DevOps Artifacts feed + credentials as the Gradle publish.
          TWINE_USERNAME: ${{ secrets.AZURE_DEVOPS_ARTIFACT_USERNAME }}
          TWINE_PASSWORD: ${{ secrets.AZURE_DEVOPS_ARTIFACT_TOKEN }}
          TWINE_REPOSITORY_URL: https://pkgs.dev.azure.com/hmcts/Artifacts/_packaging/hmcts-lib/pypi/upload/
        run: uvx twine upload --non-interactive dist/*
