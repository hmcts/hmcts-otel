name: Lint

# Lint / format / type-check gate.
#   - ruff check + ruff format --check  → blocking
#   - pyright                           → blocking

on:
  pull_request:
    branches: [main]
    # Skip docs/config-only changes — nothing to lint/type-check.
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
      - '.claude/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Ruff + Pyright
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: Ruff lint
        run: uv run ruff check . --output-format=github

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Pyright
        run: uv run pyright
