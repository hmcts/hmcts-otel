name: Secrets Scanner
on:
  pull_request:
    branches:
      - main
  schedule:
    - cron: '0 4 * * 4' # Every Thursday at 04:00
  workflow_dispatch:

env:
  # One version for the scan job and the pre-commit job, so both apply the same rules.
  # SHA-256 is the linux x64 line of gitleaks_8.30.1_checksums.txt.
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # hmcts/secrets-scanner@v1 runs gitleaks-action@v2, which scans from the parent
      # of the PR's first commit and needs a licence key for organisation repositories.
      # When the PR reaches a root commit (the 0.2.2 release branch joined main's
      # history to a separately rooted one) that parent does not exist and the scan
      # aborts. gitleaks and TruffleHog run inline instead, as in
      # hmcts/batch-audio-transcription, with the range worked out here.
      - name: Gitleaks scanning
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}" \
            -o "/tmp/${archive}"
          echo "${GITLEAKS_SHA256}  /tmp/${archive}" | sha256sum -c -
          tar -xzf "/tmp/${archive}" -C /tmp gitleaks
          if [ -n "$BASE" ] && git rev-parse --quiet --verify "${BASE}^" >/dev/null 2>&1; then
            LOG_RANGE="${BASE}^..${HEAD}"
          elif [ -n "$BASE" ]; then
            LOG_RANGE="${BASE}..${HEAD}"
          else
            LOG_RANGE="$HEAD"
          fi
          # --first-parent skips the other side of a merge. A pull request needs
          # that, because this release branch reaches a root commit. A scheduled
          # or manual run on main must walk every parent: after a merge commit,
          # first-parent history never sees the commits that arrived only on the
          # other side.
          if [ "$EVENT_NAME" = "pull_request" ]; then
            LOG_OPTS="--no-merges --first-parent ${LOG_RANGE}"
          else
            LOG_OPTS="${LOG_RANGE}"
          fi
          /tmp/gitleaks detect --redact -v --exit-code=2 \
            --report-format=sarif --report-path=results.sarif \
            --log-opts="${LOG_OPTS}"

      - name: TruffleHog scanning
        # Action v3.99.7. The published image tag has no v prefix.
        uses: trufflesecurity/trufflehog@31ce31ee1abbcc7dc8eee5764c17121c3044c8b2
        with:
          version: "3.99.7"
          base: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
          head: ${{ github.event.pull_request.head.sha || github.sha }}
          extra_args: --results=verified

  pre-commit:
    name: pre-commit (secret guard)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install gitleaks
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}" \
            -o "/tmp/${archive}"
          echo "${GITLEAKS_SHA256}  /tmp/${archive}" | sha256sum -c -
          sudo tar -xzf "/tmp/${archive}" -C /usr/local/bin gitleaks
          gitleaks version
      - name: Run pre-commit
        env:
          # Needs uv; the Tests workflow runs the same conventions-doc check.
          SKIP: conventions-doc
        run: |
          python -m pip install --upgrade pip
          pip install pre-commit
          pre-commit run --all-files --show-diff-on-failure
