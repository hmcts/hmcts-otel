name: Secrets Scanner
on:
  pull_request:
    branches:
      - main
  schedule:
    - cron: '0 4 * * 4' # Every Thursday at 04:00
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # hmcts/secrets-scanner@v1 runs gitleaks-action@v2, which scans from the parent
      # of the PR's first commit and needs a licence key for organisation repositories.
      # When the PR reaches a root commit (the 0.2.2 release branch joined main's
      # history to a separately rooted one) that parent does not exist and the scan
      # aborts. gitleaks and TruffleHog run inline instead, as in
      # hmcts/batch-audio-transcription, with the range worked out here.
      - name: Gitleaks scanning
        run: |
          BASE="${{ github.event.pull_request.base.sha || github.event.before || '' }}"
          HEAD="${{ github.event.pull_request.head.sha || github.sha }}"
          wget -q https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz -O /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          if [ -n "$BASE" ] && git rev-parse --quiet --verify "${BASE}^" >/dev/null 2>&1; then
            LOG_RANGE="${BASE}^..${HEAD}"
          elif [ -n "$BASE" ]; then
            LOG_RANGE="${BASE}..${HEAD}"
          else
            LOG_RANGE="$HEAD"
          fi
          /tmp/gitleaks detect --redact -v --exit-code=2 \
            --report-format=sarif --report-path=results.sarif \
            --log-opts="--no-merges --first-parent ${LOG_RANGE}"

      - name: TruffleHog scanning
        uses: trufflesecurity/trufflehog@main
        with:
          base: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
          head: ${{ github.event.pull_request.head.sha || github.sha }}
          extra_args: --results=verified

  pre-commit:
    name: pre-commit (secret guard)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install gitleaks
        run: |
          GITLEAKS_VERSION=8.30.1
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin gitleaks
          gitleaks version
      - name: Run pre-commit
        env:
          # Needs uv; the Tests workflow runs the same conventions-doc check.
          SKIP: conventions-doc
        run: |
          python -m pip install --upgrade pip
          pip install pre-commit
          pre-commit run --all-files --show-diff-on-failure
